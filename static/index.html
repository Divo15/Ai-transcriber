<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Concall Analyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:           #0b0b13;
  --surface:      #13131e;
  --surface-2:    #1b1b2a;
  --border:       #26263a;
  --border-hover: #38385a;
  --accent:       #7b7cf8;
  --accent-2:     #a78bfa;
  --accent-sub:   rgba(123,124,248,0.11);
  --accent-bdr:   rgba(123,124,248,0.32);
  --text:         #eeeef4;
  --text-2:       #9898b0;
  --text-3:       #55556a;
  --green:        #22c55e;
  --green-sub:    rgba(34,197,94,0.11);
  --amber:        #f59e0b;
  --amber-sub:    rgba(245,158,11,0.11);
  --red:          #f87171;
  --red-sub:      rgba(248,113,113,0.11);
  --cyan:         #22d3ee;
  --cyan-sub:     rgba(34,211,238,0.11);
  --teal:         #2dd4bf;
  --teal-sub:     rgba(45,212,191,0.11);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* Noise texture */
body::before{
  content:'';
  position:fixed;inset:0;
  opacity:0.022;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;
  pointer-events:none;z-index:0;
}

/* Top accent line */
.top-accent{
  position:fixed;top:0;left:0;right:0;height:1.5px;z-index:100;
  background:linear-gradient(90deg,transparent 0%,var(--accent) 30%,var(--accent-2) 60%,rgba(34,211,238,0.4) 80%,transparent 100%);
}

/* Header */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:50;
  border-bottom:1px solid var(--border);
  background:rgba(11,11,19,0.9);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.header-inner{
  max-width:680px;margin:0 auto;padding:0 24px;
  height:52px;display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{
  width:28px;height:28px;
  background:linear-gradient(135deg,rgba(123,124,248,0.25),rgba(167,139,250,0.15));
  border:1px solid var(--accent-bdr);
  border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:0.82rem;
}
.logo-name{font-size:0.88rem;font-weight:600;color:var(--text);letter-spacing:-0.01em;}
.status-pill{
  display:flex;align-items:center;gap:6px;
  font-family:'DM Mono',monospace;font-size:0.62rem;
  color:var(--text-3);letter-spacing:0.04em;
}
.status-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 2px rgba(48,164,108,0.2);
  animation:blink 2.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* Main */
main{
  max-width:680px;margin:0 auto;
  padding:84px 24px 64px;
  position:relative;z-index:1;
}

/* Page head */
.page-head{margin-bottom:32px;}
.page-eyebrow{
  font-family:'DM Mono',monospace;font-size:0.64rem;
  letter-spacing:0.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:9px;
}
.page-title{
  font-size:1.55rem;font-weight:600;letter-spacing:-0.03em;
  color:var(--text);line-height:1.2;margin-bottom:7px;
}
.page-desc{font-size:0.875rem;color:var(--text-2);max-width:460px;}

/* Card */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;overflow:hidden;margin-bottom:14px;
}
.card-head{
  padding:10px 16px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.015);
  display:flex;align-items:center;gap:8px;
}
.card-label{font-size:0.74rem;font-weight:500;color:var(--text-3);letter-spacing:-0.01em;}
.card-body{padding:16px;}

/* Drop zone */
.drop-zone{
  border:1.5px dashed var(--border);
  border-radius:10px;padding:44px 24px;text-align:center;
  cursor:pointer;transition:all 0.2s ease;
}
.drop-zone:hover,.drop-zone.on{
  border-color:var(--accent);
  background:var(--accent-sub);
}
.drop-zone:hover .drop-icon,.drop-zone.on .drop-icon{
  color:var(--accent);transform:translateY(-2px);
}
.drop-icon{
  display:block;font-size:1.5rem;margin-bottom:10px;
  color:var(--text-3);transition:all 0.2s ease;
}
.drop-title{font-size:0.9rem;font-weight:500;color:var(--text);margin-bottom:4px;}
.drop-sub{
  font-family:'DM Mono',monospace;font-size:0.67rem;
  color:var(--text-3);letter-spacing:0.04em;
}

/* File chip */
.file-chip{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;
}
.file-icon{font-size:1.25rem;}
.file-name{font-size:0.85rem;font-weight:500;color:var(--text);}
.file-meta{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text-3);}
.file-remove{
  margin-left:auto;background:none;border:none;cursor:pointer;
  color:var(--text-3);font-size:0.85rem;padding:4px 6px;
  border-radius:4px;line-height:1;transition:all 0.15s;
}
.file-remove:hover{color:var(--red);background:var(--red-sub);}

/* Button */
.analyze-btn{
  display:block;width:100%;margin-top:14px;padding:11px 20px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
  color:#fff;border:none;border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:0.875rem;font-weight:500;
  cursor:pointer;letter-spacing:-0.01em;
  transition:all 0.2s ease;position:relative;overflow:hidden;
  box-shadow:0 2px 12px rgba(123,124,248,0.25);
}
.analyze-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,0.08),transparent);
  pointer-events:none;
}
.analyze-btn:hover{background:linear-gradient(135deg,#8b8cfb,#a78bfa);box-shadow:0 0 0 3px rgba(123,124,248,0.25),0 4px 16px rgba(123,124,248,0.2);}
.analyze-btn:disabled{
  background:var(--surface-2);color:var(--text-3);
  cursor:not-allowed;box-shadow:none;
}
.analyze-btn:disabled::after{display:none;}

/* Progress */
.progress-wrap{margin-top:14px;}
.progress-bar{height:2px;background:var(--border);border-radius:999px;overflow:hidden;}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--cyan));
  border-radius:999px;
  animation:prog 2.2s ease-in-out infinite;
  box-shadow:0 0 8px rgba(123,124,248,0.5);
}
@keyframes prog{
  0%  {width:3%;margin-left:0}
  50% {width:55%;margin-left:0}
  100%{width:3%;margin-left:97%}
}
.progress-label{
  margin-top:8px;font-family:'DM Mono',monospace;
  font-size:0.67rem;color:var(--text-3);letter-spacing:0.04em;
}

/* Error */
.error-msg{
  display:flex;align-items:flex-start;gap:8px;
  margin-top:12px;padding:10px 14px;
  background:var(--red-sub);border:1px solid rgba(229,72,77,0.2);
  border-radius:8px;font-size:0.82rem;color:#fca5a5;
}

/* ─── RESULTS ─── */
.results-wrap{animation:fadeUp 0.35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

.summary-header{
  background:var(--surface);
  border:1px solid var(--border);border-radius:12px;
  overflow:hidden;margin-bottom:10px;
}
.summary-accent{
  height:2px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent-2) 45%,var(--cyan) 75%,transparent 100%);
}
.summary-body{padding:20px 22px 18px;}
.summary-meta{
  font-family:'DM Mono',monospace;font-size:0.62rem;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:8px;
}
.summary-company{
  font-size:1.22rem;font-weight:600;
  letter-spacing:-0.025em;color:var(--text);margin-bottom:2px;
}
.summary-period{font-size:0.82rem;color:var(--text-2);margin-bottom:14px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;}
.badge{
  display:inline-flex;align-items:center;
  font-family:'DM Mono',monospace;font-size:0.62rem;
  font-weight:500;letter-spacing:0.06em;text-transform:uppercase;
  padding:3px 10px;border-radius:6px;
}
.badge-opt{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.28);}
.badge-cau{background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.3);}
.badge-neu{background:rgba(34,211,238,0.1);color:#67e8f9;border:1px solid rgba(34,211,238,0.28);}
.badge-pes{background:rgba(248,113,113,0.12);color:#fca5a5;border:1px solid rgba(248,113,113,0.28);}
.badge-hi {background:rgba(45,212,191,0.1);color:#5eead4;border:1px solid rgba(45,212,191,0.28);}
.badge-med{background:rgba(245,158,11,0.11);color:#fcd34d;border:1px solid rgba(245,158,11,0.28);}
.badge-lo {background:rgba(248,113,113,0.11);color:#fca5a5;border:1px solid rgba(248,113,113,0.28);}

/* Section cards */
.sections{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.sec-card{
  background:var(--surface);
  border:1px solid var(--border);border-radius:10px;
  overflow:hidden;transition:border-color 0.2s;
}
.sec-card:hover{border-color:var(--border-hover);}
.sec-card-head{
  padding:9px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.015);
}
.sec-index{
  font-family:'DM Mono',monospace;font-size:0.6rem;
  color:var(--accent-2);font-weight:500;width:20px;flex-shrink:0;
}
.sec-title{font-size:0.82rem;font-weight:600;color:var(--text);letter-spacing:-0.01em;}
.sec-card-body{padding:14px 16px;}

/* Items */
.item-block{margin-bottom:13px;}
.item-block:last-child{margin-bottom:0;}
.item-heading{
  font-size:0.82rem;font-weight:600;color:var(--text);
  margin-bottom:7px;padding-left:10px;
  border-left:2px solid var(--accent);
}
.item-subheading{
  font-size:0.8rem;font-weight:600;color:var(--text-2);
  margin:10px 0 6px;
}
.item-prose{
  font-size:0.84rem;color:var(--text-2);
  line-height:1.72;margin-bottom:8px;
}
.bullets{list-style:none;display:flex;flex-direction:column;gap:5px;}
.bullets li{
  position:relative;padding-left:16px;
  font-size:0.83rem;color:var(--text-2);line-height:1.68;
}
.bullets li::before{
  content:'▸';position:absolute;left:0;top:0;
  color:var(--accent-2);font-size:0.6rem;line-height:2.1;
}
.bullets li b,.item-prose b{font-weight:600;color:var(--text);}
.q-span{color:var(--cyan);font-style:italic;}

/* Result footer */
.result-footer{
  padding:10px 16px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:6px;
  font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--text-3);
}
.result-footer b{color:var(--text-2);font-weight:500;}

@media(max-width:600px){
  .page-title{font-size:1.3rem;}
  main{padding:74px 16px 48px;}
  .header-inner{padding:0 16px;}
}
</style>
</head>
<body>

<div class="top-accent"></div>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">📊</div>
      <span class="logo-name">Concall Analyzer</span>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span>Claude · Active</span>
    </div>
  </div>
</header>

<main>

  <div class="page-head">
    <div class="page-eyebrow">Earnings Intelligence</div>
    <h1 class="page-title">Concall Summarizer</h1>
    <p class="page-desc">Upload an earnings call transcript and get a structured, analyst-grade summary — automatically.</p>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="card-label">Upload transcript</span>
    </div>
    <div class="card-body">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fi').click()">
        <input type="file" id="fi" accept=".pdf,.docx,.txt" style="display:none" onchange="setFile(event.target.files[0])"/>
        <div id="dropContent">
          <span class="drop-icon">↑</span>
          <div class="drop-title">Drop file here or click to browse</div>
          <div class="drop-sub">PDF · DOCX · TXT · Max 20 MB</div>
        </div>
      </div>
      <button class="analyze-btn" id="runBtn" onclick="run()" disabled>Analyze transcript</button>
      <div id="loader" style="display:none">
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill"></div></div>
          <div class="progress-label" id="loaderTxt">Processing…</div>
        </div>
      </div>
      <div id="errBox"></div>
    </div>
  </div>

  <div id="results"></div>

</main>

<script>
let selFile = null;

const dz = document.getElementById('dropZone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('on'); });
dz.addEventListener('dragleave', () => dz.classList.remove('on'));
dz.addEventListener('drop',      e => { e.preventDefault(); dz.classList.remove('on'); if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });

function setFile(f) {
  selFile = f;
  const sz = f.size < 1048576 ? (f.size / 1024).toFixed(1) + ' KB' : (f.size / 1048576).toFixed(1) + ' MB';
  document.getElementById('dropContent').innerHTML = `
    <div class="file-chip">
      <span class="file-icon">📄</span>
      <div>
        <div class="file-name">${f.name}</div>
        <div class="file-meta">${f.name.split('.').pop().toUpperCase()} · ${sz}</div>
      </div>
      <button class="file-remove" onclick="clearFile(event)">✕</button>
    </div>`;
  document.getElementById('runBtn').disabled = false;
  document.getElementById('errBox').innerHTML = '';
  document.getElementById('results').innerHTML = '';
}

function clearFile(e) {
  e.stopPropagation(); selFile = null;
  document.getElementById('dropContent').innerHTML = `<span class="drop-icon">↑</span><div class="drop-title">Drop file here or click to browse</div><div class="drop-sub">PDF · DOCX · TXT · Max 20 MB</div>`;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('fi').value = '';
}

function setLoader(m) { document.getElementById('loader').style.display = 'block'; document.getElementById('loaderTxt').textContent = m; }
function hideLoader()  { document.getElementById('loader').style.display = 'none'; }
function showErr(m)    { document.getElementById('errBox').innerHTML = `<div class="error-msg"><span>⚠</span><span>${m}</span></div>`; }
function esc(s)        { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmt(text) {
  if (!text) return '';
  let s = esc(text);
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/&quot;(.+?)&quot;/g, '<span class="q-span">&quot;$1&quot;</span>');
  return s;
}

async function run() {
  if (!selFile) { showErr('Please select a file.'); return; }
  if (selFile.size > 20 * 1048576) { showErr('File too large — max 20 MB.'); return; }

  document.getElementById('runBtn').disabled = true;
  document.getElementById('errBox').innerHTML = '';
  document.getElementById('results').innerHTML = '';
  setLoader('Uploading document…');

  try {
    const formData = new FormData();
    formData.append('file', selFile);
    setLoader('Analyzing concall — this takes 30–90 seconds for large documents…');

    const res  = await fetch('/analyze', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `Server error ${res.status}`);

    hideLoader();
    render(data.analysis, data.filename, selFile.size);

  } catch (err) {
    hideLoader();
    showErr(err.message || 'Something went wrong. Please retry.');
  }

  document.getElementById('runBtn').disabled = false;
}

function toneClass(t) { return { Optimistic:'badge-opt', Cautious:'badge-cau', Neutral:'badge-neu', Pessimistic:'badge-pes' }[t] || 'badge-neu'; }
function confClass(c)  { return { High:'badge-hi', Medium:'badge-med', Low:'badge-lo' }[c] || 'badge-med'; }

function renderBullets(bullets) {
  if (!bullets || !bullets.length) return '';
  return `<ul class="bullets">${bullets.map(b => `<li>${fmt(b)}</li>`).join('')}</ul>`;
}

function renderItem(item) {
  if (item.type === 'numbered')
    return `<div class="item-block"><div class="item-heading">${fmt(item.heading || '')}</div>${renderBullets(item.bullets)}</div>`;
  if (item.type === 'subheading')
    return `<div class="item-block"><div class="item-subheading">${fmt(item.heading || '')}</div>${renderBullets(item.bullets)}</div>`;
  if (item.type === 'prose')
    return `<p class="item-prose">${fmt(item.text || '')}</p>`;
  return '';
}

function render(d, filename, filesize) {
  const sz = filesize < 1048576 ? (filesize / 1024).toFixed(0) + ' KB' : (filesize / 1048576).toFixed(1) + ' MB';

  const sections = (d.sections || []).map((sec, i) => `
    <div class="sec-card">
      <div class="sec-card-head">
        <span class="sec-index">${String(i + 1).padStart(2, '0')}</span>
        <span class="sec-title">${esc(sec.title || '')}</span>
      </div>
      <div class="sec-card-body">
        ${(sec.items || []).map(renderItem).join('')}
      </div>
    </div>`).join('');

  document.getElementById('results').innerHTML = `
  <div class="results-wrap">
    <div class="summary-header">
      <div class="summary-accent"></div>
      <div class="summary-body">
        <div class="summary-meta">Concall Research Summary</div>
        <div class="summary-company">${esc(d.company_name || 'Company')}</div>
        <div class="summary-period">${esc(d.period || 'Period not identified')}</div>
        <div class="badges">
          <span class="badge ${toneClass(d.management_tone)}">Tone · ${esc(d.management_tone || '—')}</span>
          <span class="badge ${confClass(d.confidence_level)}">Confidence · ${esc(d.confidence_level || '—')}</span>
        </div>
      </div>
    </div>
    <div class="sections">${sections}</div>
    <div class="result-footer">
      <span>📄 <b>${esc(filename)}</b> · ${sz}</span>
      <span>Model: <b>claude-sonnet-4-6</b></span>
      <span><b>${new Date().toLocaleString()}</b></span>
    </div>
  </div>`;
}
</script>
</body>
</html>
